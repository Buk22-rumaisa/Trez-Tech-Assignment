<!DOCTYPE html>
<html>
    <body>
        <style>s
.dark-mode {
    background-color: black;
    color: white;
}
</style>

<button id="toggle">Toggle Dark Mode</button>

<script>
document.getElementById("toggle").addEventListener("click", function(){
    document.body.classList.toggle("dark-mode");
});
</script>
    </body>
</html>
